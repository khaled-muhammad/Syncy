name: Flutter Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Match tag to app version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ -z "$app_version" || "$tag_version" != "$app_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $app_version" >&2
            exit 1
          fi
          echo "version=$app_version" >> "$GITHUB_OUTPUT"

  android:
    name: Build Android release
    runs-on: ubuntu-latest
    needs: metadata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run protocol and app tests
        run: flutter test --no-pub

      - name: Test Android signing verifier
        run: bash .github/scripts/test_verify_android_signing.sh

      - name: Restore and validate Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: bash .github/scripts/prepare_android_signing.sh

      - name: Build Android APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Verify Android APK signatures
        run: |
          bash .github/scripts/verify_android_signing.sh \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Prepare Android assets
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/app-universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release/
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release/
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release/

      - name: Upload Android assets
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release/*
          if-no-files-found: error

      - name: Remove Android release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/syncy-release.jks"

  windows:
    name: Build Windows release
    runs-on: windows-latest
    needs: metadata

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Run protocol and app tests
        run: flutter test --no-pub

      - name: Build Windows app
        run: flutter build windows --release

      - name: Package Windows app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath release\syncy-windows-release.zip `
            -Force

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/syncy-windows-release.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [metadata, android, windows]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release
          merge-multiple: true

      - name: Generate update protocol manifest
        run: |
          python .github/scripts/generate_update_manifest.py \
            --version "${{ needs.metadata.outputs.version }}" \
            --android release/app-universal.apk \
            --windows release/syncy-windows-release.zip \
            --output release/syncy-update-v1.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true
